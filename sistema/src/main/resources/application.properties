spring.application.name=sistema
# ===============================
# DATABASE
# ===============================
#spring.datasource.url=jdbc:mysql://localhost:3306/sistema
#spring.datasource.username=root
#spring.datasource.password=
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.servlet.session.timeout=24h
# ===============================
# JSP
# ===============================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===============================
# LOGS (DEBUG)
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
# Evita que los cuerpos salientes (que incluyen secretos de webhooks) aparezcan en los logs.
logging.level.org.springframework.web.client=INFO

# Archivos de productos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Canales de venta. Se configuran como variables de entorno en produccion.
integraciones.public-base-url=${PUBLIC_BASE_URL:}
integraciones.encryption-key=${INTEGRATIONS_ENCRYPTION_KEY:}
integraciones.webhook-secret=${INTEGRATIONS_WEBHOOK_SECRET:}
integraciones.woocommerce.url=${WC_URL:${WOOCOMMERCE_URL:}}
integraciones.woocommerce.consumer-key=${WC_CONSUMER_KEY:${WOOCOMMERCE_CONSUMER_KEY:}}
integraciones.woocommerce.consumer-secret=${WC_CONSUMER_SECRET:${WOOCOMMERCE_CONSUMER_SECRET:}}
integraciones.mercadolibre.access-token=${ML_ACCESS_TOKEN:${MERCADOLIBRE_ACCESS_TOKEN:}}
integraciones.mercadolibre.refresh-token=${ML_REFRESH_TOKEN:${MERCADOLIBRE_REFRESH_TOKEN:}}
integraciones.mercadolibre.client-id=${ML_CLIENT_ID:${MERCADOLIBRE_CLIENT_ID:}}
integraciones.mercadolibre.client-secret=${ML_CLIENT_SECRET:${MERCADOLIBRE_CLIENT_SECRET:}}
integraciones.mercadolibre.redirect-uri=${MERCADOLIBRE_REDIRECT_URI:}
integraciones.mercadolibre.category-id=${MERCADOLIBRE_CATEGORY_ID:}
integraciones.mercadolibre.listing-type-id=${MERCADOLIBRE_LISTING_TYPE_ID:gold_special}
integraciones.mercadolibre.user-products=${MERCADOLIBRE_USER_PRODUCTS:true}
integraciones.tiendanube.store-id=${TN_STORE_ID:${TIENDANUBE_STORE_ID:}}
integraciones.tiendanube.access-token=${TN_ACCESS_TOKEN:${TIENDANUBE_ACCESS_TOKEN:}}
integraciones.tiendanube.user-agent=${TN_USER_AGENT:${TIENDANUBE_USER_AGENT:SistemaStock/1.0}}
integraciones.tiendanube.client-id=${TN_CLIENT_ID:${TIENDANUBE_CLIENT_ID:}}
integraciones.tiendanube.client-secret=${TN_CLIENT_SECRET:${TIENDANUBE_CLIENT_SECRET:}}
integraciones.tiendanube.redirect-uri=${TIENDANUBE_REDIRECT_URI:${PUBLIC_BASE_URL:}/canales/tiendanube/callback}

