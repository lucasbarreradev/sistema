services:
  sistema:
    build: sistema
    mem_limit: 1g
    ports:
      - "8082:8080"
    environment:
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires -Xms256m -Xmx512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp

      DB_URL: ${DB_URL}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}

      APP_ADMIN_USER: ${ADMIN_USER:-admin}
      APP_ADMIN_PASS: ${ADMIN_PASS}
      APP_EMPLEADO_USER: ${EMPLEADO_USER:-empleado}
      APP_EMPLEADO_PASS: ${EMPLEADO_PASS}

      # Integraciones opcionales con canales de venta
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MERCADOLIBRE_ACCESS_TOKEN: ${MERCADOLIBRE_ACCESS_TOKEN:-}
      MERCADOLIBRE_REFRESH_TOKEN: ${MERCADOLIBRE_REFRESH_TOKEN:-}
      MERCADOLIBRE_CLIENT_ID: ${MERCADOLIBRE_CLIENT_ID:-}
      MERCADOLIBRE_CLIENT_SECRET: ${MERCADOLIBRE_CLIENT_SECRET:-}
      MERCADOLIBRE_REDIRECT_URI: ${MERCADOLIBRE_REDIRECT_URI:-}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTEGRATIONS_WEBHOOK_SECRET: ${INTEGRATIONS_WEBHOOK_SECRET:-}

      ML_ACCESS_TOKEN: ${ML_ACCESS_TOKEN:-}
      ML_REFRESH_TOKEN: ${ML_REFRESH_TOKEN:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_SITE_ID: ${ML_SITE_ID:-MLA}
      MERCADOLIBRE_CATEGORY_ID: ${MERCADOLIBRE_CATEGORY_ID:-}
      MERCADOLIBRE_LISTING_TYPE_ID: ${MERCADOLIBRE_LISTING_TYPE_ID:-gold_special}
      MERCADOLIBRE_USER_PRODUCTS: ${MERCADOLIBRE_USER_PRODUCTS:-true}
      TIENDANUBE_STORE_ID: ${TIENDANUBE_STORE_ID:-}
      TIENDANUBE_ACCESS_TOKEN: ${TIENDANUBE_ACCESS_TOKEN:-}
      TIENDANUBE_USER_AGENT: ${TIENDANUBE_USER_AGENT:-SistemaStock/1.0}
      TN_STORE_ID: ${TN_STORE_ID:-}
      TN_ACCESS_TOKEN: ${TN_ACCESS_TOKEN:-}
      TN_USER_AGENT: ${TN_USER_AGENT:-SistemaStock/1.0}
      TN_CLIENT_ID: ${TN_CLIENT_ID:-}
      TN_CLIENT_SECRET: ${TN_CLIENT_SECRET:-}
      TIENDANUBE_CLIENT_ID: ${TIENDANUBE_CLIENT_ID:-}
      TIENDANUBE_CLIENT_SECRET: ${TIENDANUBE_CLIENT_SECRET:-}
      TIENDANUBE_REDIRECT_URI: ${TIENDANUBE_REDIRECT_URI:-}

    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      joya:
        condition: service_healthy

  joya:
    image: mysql:8.0
    ports:
      - "3309:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
